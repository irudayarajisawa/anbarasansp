<!-- Latest Updates and Today's Quotes -->
<section class="py-4">
  <div class="container">
    <div class="row align-items-start">

      <!-- Latest Updates -->
      <div class="col-md-6">

        <h5 class="mb-3" style="color:#5e1f1f; font-weight:600;">
          Latest Updates
        </h5>

        <ul class="list-unstyled updates-list">

          {% for update in site.data.latestupdates limit:3 %}
          <li class="mb-3 d-flex">

            <span class="me-2" style="color:#5e1f1f;">
              &#10146;
            </span>

            <span>
              {{ update.text }}
            </span>

          </li>
          {% endfor %}

        </ul>

        <a href="{{ '/updates' | relative_url }}"
           style="color:#5e1f1f; font-size:14px;">
          Read more
        </a>

      </div>

      <!-- Divider -->
      <div class="col-md-1 d-none d-md-flex justify-content-center">
        <div style="width:1px; background:#ccc; height:100%;"></div>
      </div>

      <!-- Today's Quotes -->
      <div class="col-md-5">

        <h5 class="mb-3" style="color:#5e1f1f; font-weight:600;">
          Today's Quotes
        </h5>

        {% assign day_index = site.time | date: "%j" | modulo: site.data.quotes.size %}
        {% assign today_quote = site.data.quotes[day_index] %}

        <p class="mb-2 d-flex">

          <span class="me-2" style="color:#5e1f1f;">
            &#10146;
          </span>

          <span style="color:#777;">
            {{ today_quote }}
          </span>

        </p>

      </div>

    </div>
  </div>
</section>
